# subdex configuration. Env vars override these (WS_URL, DATABASE_URL, …).
# Everything here is optional except giving source.url + store.url *somewhere*
# (here or via WS_URL / DATABASE_URL). See docs/GUIDE.md § Config.

[source]
# url = "wss://rpc.polkadot.io"   # set here or via WS_URL
batch_size = 100                   # blocks fetched per request
concurrency = 16                   # in-flight block fetches (RPC latency hiding)
ss58_prefix = 42                   # 42 = generic Substrate (5…), 0 = Polkadot (1…)
strict = false                     # true = a per-item decode failure aborts the block

[store]
# url = "postgres://postgres:postgres@localhost:55432/subdex"  # or DATABASE_URL
max_connections = 5
reorg_retention = 5000             # blocks of (height,hash) kept for reorg checks

[processor]
# start_height = 1000000           # backfill start on a fresh DB (default: head-20)
batch_size = 100                   # blocks committed per transaction
max_reorg_depth = 64               # bound on how far a reorg may rewind
